name: Experiment validation
on:
  pull_request:
    paths: ['experiments/**', '.github/workflows/experiments.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  cpu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install numpy matplotlib
      - run: python -m unittest discover -s experiments/tests -v
      - run: cmake -S experiments/cuda -B experiments/cuda/build-host -DQMAT_ENABLE_CUDA=OFF
      - run: cmake --build experiments/cuda/build-host -j2
      - run: ctest --test-dir experiments/cuda/build-host --output-on-failure
      - run: python experiments/prepare_application.py --smoke
      - run: experiments/cuda/build-host/qmat_apply_host experiments/data_application_a100/smoke/smoke_tol0.05.bin
      - run: python experiments/prepare_data.py
      - run: python experiments/run_experiments.py --skip-gpu
      - run: python experiments/plot_results.py
  cuda-build:
    runs-on: ubuntu-latest
    container: nvidia/cuda:12.6.3-devel-ubuntu22.04
    steps:
      - uses: actions/checkout@v4
      - run: apt-get update && apt-get install -y --no-install-recommends g++ python3-pip
      - run: python3 -m pip install 'cmake>=3.24,<4' ninja
      - run: cmake -S experiments/cuda -B experiments/cuda/build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_CUDA_ARCHITECTURES=80
      - run: cmake --build experiments/cuda/build -j2
      # Hosted runners compile device code but do not provide an NVIDIA GPU.
      - run: ctest --test-dir experiments/cuda/build --output-on-failure -R packing_and_input
